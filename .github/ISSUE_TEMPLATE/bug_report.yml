name: Bug report
description: Report a reproducible problem using sanitized or synthetic data
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach an original utility export or include names, addresses, account or meter identifiers, readings, costs, tokens, signed URLs, HAR files, or raw provider responses.** Prefer a minimal synthetic file. Review anonymized output before sharing it.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `gbdata version`
      placeholder: gbdata v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and removed all customer data, credentials, identifiers, readings, costs, timestamps, and private provider responses.
          required: true
